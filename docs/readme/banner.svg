<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
<title id="t">Bearly Prepared</title>
<desc id="d">A felt bear carries a comically tall, swaying stack of kettle, teacups, folding chair and standard lamp across a meadow.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd8e4"/><stop offset="1" stop-color="#f6eedb"/></linearGradient>
<linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8703f"/><stop offset="1" stop-color="#8a5a34"/></linearGradient>
</defs>
<style>
.sway{transform-origin:936px 222px;animation:sway 6s ease-in-out infinite}
.n1{transform-origin:936px 176px;animation:lag 6s ease-in-out infinite}
.n2{transform-origin:936px 120px;animation:lag 6s ease-in-out .15s infinite}
.lamp{transform-origin:936px 92px;animation:teeter 6s ease-in-out infinite}
.head{transform-origin:880px 236px;animation:look 6s ease-in-out infinite}
.sock{transform-origin:1182px 102px;animation:sock 1.5s ease-in-out infinite}
.cloud{animation:drift 6s ease-in-out infinite alternate}
.grass{transform-origin:50% 100%;transform-box:fill-box;animation:grass 3s ease-in-out infinite alternate}
@keyframes sway{0%,100%{transform:rotate(-3deg)}22%{transform:rotate(5deg)}45%{transform:rotate(-4deg)}66%{transform:rotate(9.5deg)}74%{transform:rotate(10.5deg)}86%{transform:rotate(-1deg)}}
@keyframes lag{0%,100%{transform:rotate(-1.5deg)}25%{transform:rotate(2.5deg)}48%{transform:rotate(-2deg)}70%{transform:rotate(4deg)}88%{transform:rotate(-1deg)}}
@keyframes teeter{0%,62%,100%{transform:rotate(0)}68%{transform:rotate(6deg)}71%{transform:rotate(-2deg)}74%{transform:rotate(7deg)}78%{transform:rotate(0)}}
@keyframes look{0%,55%,100%{transform:rotate(0)}64%,80%{transform:rotate(-10deg) translateY(-3px)}}
@keyframes sock{0%,100%{transform:rotate(-4deg) scaleX(1)}50%{transform:rotate(5deg) scaleX(.94)}}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes grass{to{transform:skewX(-8deg)}}
@media (prefers-reduced-motion:reduce){.sway,.n1,.n2,.lamp,.head,.sock,.cloud,.grass{animation:none}}
</style>
