<g fill="#6f8f3a"><path class="grass" d="M740 300 l4-22 4 22z"/><path class="grass" d="M1010 296 l4-26 5 26z"/><path class="grass" d="M1150 300 l3-18 4 18z"/><path class="grass" d="M560 310 l4-24 4 24z"/></g>
<g><circle cx="700" cy="318" r="5" fill="#f2d24a"/><circle cx="1110" cy="312" r="5" fill="#e07a8a"/><circle cx="560" cy="330" r="4" fill="#f4f0e6"/><circle cx="1200" cy="324" r="4" fill="#9a8ae0"/></g>
<text x="72" y="150" font-family="ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="900" font-size="84" fill="#3a2a1e" letter-spacing="-1">Bearly</text>
<text x="72" y="228" font-family="ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="900" font-size="84" fill="#c84b3c" letter-spacing="-1">Prepared</text>
<text x="76" y="268" font-family="ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="700" font-size="22" fill="#6b5440">A short hike, a very tall load, one civilised cup of tea.</text>
