<g class="lamp"><rect x="922" y="48" width="28" height="7" rx="3" fill="#c8a050"/><rect x="934" y="-6" width="4" height="56" fill="#c8a050"/><path d="M918 -12 h36 l12 26 h-60z" fill="#f1dfb8"/><rect x="906" y="12" width="60" height="4" rx="2" fill="#c84b3c"/></g>
