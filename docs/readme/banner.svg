<g class="head"><circle cx="840" cy="176" r="16" fill="#9a6438"/><circle cx="840" cy="176" r="8" fill="#d9a07a"/><circle cx="904" cy="172" r="16" fill="#9a6438"/><circle cx="904" cy="172" r="8" fill="#d9a07a"/><circle cx="872" cy="206" r="44" fill="url(#fur)"/><ellipse cx="864" cy="222" rx="18" ry="13" fill="#e8d2ac"/><ellipse cx="862" cy="214" rx="8" ry="6" fill="#2a1f1a"/><circle cx="852" cy="194" r="5" fill="#2a1f1a"/><circle cx="880" cy="192" r="5" fill="#2a1f1a"/><circle cx="853" cy="192" r="1.6" fill="#fff"/><circle cx="881" cy="190" r="1.6" fill="#fff"/><path d="M845 182 l12 -3 M874 180 l12 1" stroke="#6e4527" stroke-width="3" stroke-linecap="round"/></g>
</g>
</g>
</svg>
