<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BEARLY PREPARED</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Pack and balance an absurd load on a bear's short hike" />
    <style>
      /* Arrival veil: a felt patch with a stitched edge and a little bear peeking over a teacup.
         Shown until worldReady() in src/loader.ts lifts it after the first rendered frame. */
      #arrival { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 18px; background: radial-gradient(circle at 50% 42%, #f6eedb 0%, #e9dcbc 70%, #d9c79e 100%); color: #3a2a1e; font: 800 13px/1.2 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; transition: opacity 0.6s ease, visibility 0.6s; }
      #arrival.is-done { opacity: 0; visibility: hidden; }
      #arrival .bear { position: relative; width: 84px; height: 76px; }
      #arrival .bear i { position: absolute; border-radius: 50%; background: #9a6438; }
      #arrival .bear .h { left: 17px; top: 10px; width: 50px; height: 46px; }
      #arrival .bear .e1, #arrival .bear .e2 { top: 4px; width: 20px; height: 20px; }
      #arrival .bear .e1 { left: 12px; } #arrival .bear .e2 { right: 12px; }
      #arrival .bear .m { left: 32px; top: 32px; width: 20px; height: 14px; background: #e8d2ac; }
      #arrival .bear .n { left: 38px; top: 33px; width: 8px; height: 6px; background: #2a1f1a; }
      #arrival .bear .y1, #arrival .bear .y2 { top: 24px; width: 6px; height: 7px; background: #2a1f1a; }
      #arrival .bear .y1 { left: 30px; } #arrival .bear .y2 { right: 30px; }
      #arrival .bear .c { left: 22px; top: 44px; width: 40px; height: 30px; border-radius: 4px 4px 18px 18px; background: #c84b3c; box-shadow: inset 0 -5px 0 #9e3529; }
      #arrival .bear { animation: arrival-peek 1.6s ease-in-out infinite; }
      #arrival .label { max-width: calc(100vw - 64px); text-align: center; line-height: 1.6; padding: 10px 18px; border-radius: 16px; background: #f6eedb; outline: 2px dashed #b98a5a; outline-offset: -6px; box-shadow: 0 6px 18px rgb(58 42 30 / 0.18); }
      #arrival .bar { width: 150px; height: 6px; border-radius: 6px; background: #3a2a1e22; overflow: hidden; }
      #arrival .bar i { display: block; height: 100%; width: 40%; border-radius: 6px; background: #d9a441; animation: arrival-slide 1.2s ease-in-out infinite; }
      @keyframes arrival-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes arrival-peek { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-2px); } }
      @media (prefers-reduced-motion: reduce) { #arrival .bar i { animation: none; width: 100%; } #arrival .bear { animation: none; } }
    </style>
  </head>
  <body>
    <div id="arrival" role="status" aria-live="polite"><div class="bear" aria-hidden="true"><i class="e1"></i><i class="e2"></i><i class="h"></i><i class="m"></i><i class="n"></i><i class="y1"></i><i class="y2"></i><i class="c"></i></div><span class="label">Bearly Prepared</span><div class="bar"><i></i></div><span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Packing the kettle…</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
